<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ plugin.name }} — APK Wooper</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/plugins.css') }}" />
  </head>
  <body class="plugin-page plugin-page-iframe">
    <header class="plugin-topbar">
      <a class="plugin-back" href="{{ url_for('pages.dashboard') }}" title="Back to dashboard">
        <span aria-hidden="true">&larr;</span>
        <span>Back to jobs</span>
      </a>
      <span class="plugin-topbar-title">{{ plugin.name }}</span>
      <span class="plugin-topbar-meta muted small">
        {{ plugin.source }} &middot; {{ plugin.version }} &middot; iframe
      </span>
    </header>
    <iframe
      class="plugin-iframe"
      src="{{ iframe_url }}"
      title="{{ plugin.name }}"
      referrerpolicy="no-referrer"
    ></iframe>
  </body>
</html>
